<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <meta name="description" content="HueSTD - Nền tảng chia sẻ tài liệu, đề thi và kết nối cộng đồng sinh viên Thừa Thiên Huế.">
  <title>HueSTD - Cộng đồng sinh viên Huế</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Mở rộng Tailwind để thêm breakpoint `xs` (cho mobile nhỏ) - dùng với CDN
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            xs: '420px',
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      text-rendering: optimizeLegibility;
    }

    .hue-teal {
      color: #0d9488;
    }

    .bg-hue-teal {
      background-color: #0d9488;
    }

    .border-hue-teal {
      border-color: #0d9488;
    }

    /* Ẩn scrollbar trên thanh filter tabs ngang */
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* Mượt hơn khi scroll trên iOS */
    * {
      -webkit-overflow-scrolling: touch;
    }
  </style>

</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
